<!doctype html>
<html lang="en">
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, viewport-fit=cover"
        />
        <meta
            name="description"
            content="Suide Koelkamers — Premium butchery & meat shop in Keetmanshoop, Namibia. Farm-fresh beef, lamb, pork, handmade cold meats, and a daily deli. Quality local meat for great times together."
        />
        <meta name="author" content="railwayws" />
        <meta name="robots" content="index, follow" />

        <!-- Open Graph (Facebook / LinkedIn / WhatsApp) -->
        <meta property="og:type" content="website" />
        <meta
            property="og:title"
            content="Suide Koelkamers — Where clients become friends"
        />
        <meta
            property="og:description"
            content="Premium butchery in Keetmanshoop, Namibia. Farm-fresh meat, handmade cold meats, and a daily deli."
        />
        <meta
            property="og:image"
            content="https://suidekoelkamers.com/whatsapp_preview.jpg"
        />
        <meta property="og:url" content="https://suidekoelkamers.com/" />
        <meta property="og:site_name" content="Suide Koelkamers" />

        <meta name="theme-color" content="#1a1a1a" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta
            name="apple-mobile-web-app-status-bar-style"
            content="black-translucent"
        />

        <link rel="icon" type="image/png" href="/tab_icon.png" />
        <title>Suide Koelkamers</title>

        <!-- Preconnect to Google Fonts for faster font fetch -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

        <!-- Deferred font loading: load CSS asynchronously to avoid render-blocking -->
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Rubik:wght@400;700&display=swap"
            media="print"
            onload="this.media = 'all'"
        />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Yellowtail&display=swap"
            media="print"
            onload="this.media = 'all'"
        />
        <!-- Fallback for browsers with JS disabled -->
        <noscript>
            <link
                href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Rubik:wght@400;700&display=swap"
                rel="stylesheet"
            />
            <link
                href="https://fonts.googleapis.com/css2?family=Yellowtail&display=swap"
                rel="stylesheet"
            />
        </noscript>
    </head>
    <body>
        <!-- Initial loader (shown until hero/about images are preloaded) -->
        <div id="app-loader" aria-label="Loading" role="status">
            <div class="app-loader__inner">
                <div class="app-loader__bar" aria-hidden="true">
                    <span class="app-loader__bar-fill"></span>
                </div>
            </div>
        </div>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
